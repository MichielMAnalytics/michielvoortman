<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>michiel voortman — vt100</title>
    <meta name="description" content="Michiel Voortman portfolio rendered inside a 3D VT100 terminal." />
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        color: #cfd8dc;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      #css-scene {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }
      #css-scene > div {
        pointer-events: auto;
      }
      .hud {
        position: fixed;
        z-index: 10;
        font-size: 12px;
        letter-spacing: 0.05em;
        color: #7a8a92;
        text-transform: uppercase;
        user-select: none;
        pointer-events: none;
      }
      .hud-top-left { top: 18px; left: 22px; }
      .hud-bottom-right { right: 22px; bottom: 18px; text-align: right; }
      .hud a { color: #9bb3bd; text-decoration: none; pointer-events: auto; }
      .hud a:hover { color: #e0eef3; }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #7a8a92;
        font-size: 13px;
        letter-spacing: 0.2em;
        z-index: 100;
        transition: opacity 400ms ease;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="loading">BOOTING VT100…</div>
    <canvas id="scene"></canvas>
    <div id="css-scene"></div>
    <div class="hud hud-top-left">
      michiel voortman · vt100
    </div>
    <div class="hud hud-bottom-right">
      drag to orbit · scroll to zoom
    </div>
    <script type="module" src="/src/vt100.ts"></script>
  </body>
</html>
