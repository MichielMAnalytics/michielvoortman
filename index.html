<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>michiel voortman — vt100</title>
    <meta name="description" content="Michiel Voortman portfolio rendered inside a 3D VT100 terminal." />
    <link rel="icon" type="image/svg+xml" href="/boxd-logo.svg" />
    <!-- Start the PTY iframe HTML loading in parallel with the 3D bundle so
         the boot banner is ready by the time the CSS3D screen exists. -->
    <link rel="preload" href="/term" as="document" />
    <link rel="dns-prefetch" href="/term" />
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        color: #cfd8dc;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      #css-scene {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }
      #css-scene > div {
        pointer-events: auto;
      }
      .hud {
        position: fixed;
        z-index: 10;
        font-size: 12px;
        letter-spacing: 0.05em;
        color: #7a8a92;
        text-transform: uppercase;
        user-select: none;
        pointer-events: none;
      }
      .hud-top-left { top: 18px; left: 22px; }
      .hud-bottom-right { right: 22px; bottom: 18px; text-align: right; }
      .hud-bottom-center {
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
      }
      .hud a { color: #9bb3bd; text-decoration: none; pointer-events: auto; }
      .hud a:hover { color: #e0eef3; }

      /* Chip nudging users toward the easter command. Subtle breathing
         opacity so it draws the eye without being shouty. Fades out the
         moment the user runs the fork (vt100.ts sets .hud-fork.taken). */
      .hud-fork-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border: 1px solid rgba(206, 217, 224, 0.18);
        border-radius: 999px;
        background: rgba(10, 10, 10, 0.55);
        backdrop-filter: blur(4px);
        color: #cfd8dc;
        animation: forkPulse 3.2s ease-in-out infinite;
        transition: opacity 600ms ease;
      }
      .hud-fork-chip code {
        color: #ffe27c;
        background: rgba(255, 226, 124, 0.08);
        padding: 1px 6px;
        border-radius: 4px;
        letter-spacing: 0.03em;
      }
      .hud-fork-chip.taken {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes forkPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255, 226, 124, 0); }
        50%      { box-shadow: 0 0 14px 2px rgba(255, 226, 124, 0.18); }
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #7a8a92;
        font-size: 13px;
        letter-spacing: 0.2em;
        z-index: 100;
        transition: opacity 400ms ease;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="loading">BOOTING VT100…</div>
    <canvas id="scene"></canvas>
    <div id="css-scene"></div>
    <div class="hud hud-top-left">
      michiel voortman · vt100
    </div>
    <div class="hud hud-bottom-right">
      drag to orbit · scroll to zoom
    </div>
    <div class="hud hud-bottom-center" id="hud-fork">
      <span class="hud-fork-chip">try: <code>boxd fork</code></span>
    </div>
    <script type="module" src="/src/vt100.ts"></script>
  </body>
</html>
