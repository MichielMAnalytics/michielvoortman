<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>michiel voortman — vt100</title>
    <meta name="description" content="Michiel Voortman portfolio rendered inside a 3D VT100 terminal." />
    <link rel="icon" type="image/svg+xml" href="/boxd-logo.svg" />
    <!-- Start the PTY iframe HTML loading in parallel with the 3D bundle so
         the boot banner is ready by the time the CSS3D screen exists. -->
    <link rel="preload" href="/term" as="document" />
    <link rel="dns-prefetch" href="/term" />
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        color: #cfd8dc;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      #css-scene {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }
      #css-scene > div {
        pointer-events: auto;
      }
      .hud {
        position: fixed;
        z-index: 10;
        font-size: 12px;
        letter-spacing: 0.05em;
        color: #7a8a92;
        text-transform: uppercase;
        user-select: none;
        pointer-events: none;
      }
      .hud-top-left { top: 18px; left: 22px; }
      .hud-bottom-right { right: 22px; bottom: 18px; text-align: right; }
      .hud-bottom-center {
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
      }
      .hud a { color: #9bb3bd; text-decoration: none; pointer-events: auto; }
      .hud a:hover { color: #e0eef3; }

      /* Chip nudging users toward the easter command. Subtle breathing
         opacity so it draws the eye without being shouty. Fades out the
         moment the user runs the fork (vt100.ts sets .hud-fork.taken). */
      .hud-fork-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border: 1px solid rgba(206, 217, 224, 0.18);
        border-radius: 999px;
        background: rgba(10, 10, 10, 0.55);
        backdrop-filter: blur(4px);
        color: #cfd8dc;
        animation: forkPulse 3.2s ease-in-out infinite;
        transition:
          opacity 600ms ease,
          transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1),
          border-color 220ms ease,
          background 220ms ease;
        /* Override parent .hud pointer-events:none so the chip itself
           catches clicks — but only the chip, not the wrapper. */
        pointer-events: auto;
        cursor: pointer;
      }
      .hud-fork-chip:hover {
        border-color: rgba(124, 255, 174, 0.55);
        background: rgba(15, 15, 15, 0.75);
        transform: translateY(-1px);
      }
      .hud-fork-chip:active {
        transform: translateY(0) scale(0.97);
      }
      .hud-fork-chip code {
        color: #7cffae;
        background: rgba(124, 255, 174, 0.08);
        padding: 1px 6px;
        border-radius: 4px;
        letter-spacing: 0.03em;
        transition: color 180ms ease, background 180ms ease;
      }
      .hud-fork-chip:hover code {
        color: #a4ffd0;
        background: rgba(124, 255, 174, 0.16);
      }
      .hud-fork-chip.firing {
        animation: forkIgnite 360ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      .hud-fork-chip.taken {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes forkPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(124, 255, 174, 0); }
        50%      { box-shadow: 0 0 14px 2px rgba(124, 255, 174, 0.18); }
      }
      @keyframes forkIgnite {
        0%   { transform: scale(1);    box-shadow: 0 0 0 0 rgba(124, 255, 174, 0); }
        45%  { transform: scale(1.08); box-shadow: 0 0 28px 10px rgba(124, 255, 174, 0.55); }
        100% { transform: scale(0.94); box-shadow: 0 0 0 0 rgba(124, 255, 174, 0); }
      }

      /* Each character of "boxd fork" launches from the chip as one of
         these glyphs. They arc through the void to the CRT prompt,
         color-shifting from chip-yellow into phosphor-green as they land. */
      .fork-glyph {
        position: fixed;
        left: 0;
        top: 0;
        pointer-events: none;
        z-index: 95;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 18px;
        font-weight: 600;
        color: #7cffae;
        letter-spacing: 0.02em;
        text-shadow:
          0 0 6px rgba(124, 255, 174, 0.7),
          0 0 14px rgba(124, 255, 174, 0.4),
          0 0 26px rgba(124, 255, 174, 0.18);
        will-change: transform, opacity, color;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #7a8a92;
        font-size: 13px;
        letter-spacing: 0.2em;
        z-index: 100;
        transition: opacity 400ms ease;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="loading">BOOTING VT100…</div>
    <canvas id="scene"></canvas>
    <div id="css-scene"></div>
    <div class="hud hud-top-left">
      michiel voortman · vt100
    </div>
    <div class="hud hud-bottom-right">
      drag to orbit · scroll to zoom
    </div>
    <div class="hud hud-bottom-center" id="hud-fork">
      <span class="hud-fork-chip">try: <code>boxd fork</code></span>
    </div>
    <script type="module" src="/src/vt100.ts"></script>
  </body>
</html>
