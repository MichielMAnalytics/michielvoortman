<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>michiel voortman</title>
    <meta name="description" content="Michiel Voortman — Amsterdam. Agent builder, founder. CLI-first." />
    <link rel="icon" type="image/svg+xml" href="/boxd-logo.svg" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #0a0a0a;
        overflow: hidden;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      /* Outer wrapper provides the insets that the 3D CRT wrapper's heavy
         inset shadow can fade across without eating real terminal text.
         xterm-fit doesn't respect CSS padding, so we use margin via an
         inner host div instead. */
      body {
        display: block;
      }
      #term {
        position: absolute;
        top: 24px;
        left: 28px;
        right: 32px;
        bottom: 56px;
        background: #0a0a0a;
      }
    </style>
  </head>
  <body>
    <div id="term"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
